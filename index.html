<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intelligensia 360 — Visite Virtuelle</title>
  <script src="three.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --accent:#00d4ff; --accent2:#0077ff;
      --bg:#0a0a0f; --success:#3fb950;
    }
    body { background:var(--bg); overflow:hidden; width:100vw; height:100vh;
           font-family:'Segoe UI',system-ui,sans-serif; cursor:grab; }
    body.dragging { cursor:grabbing; }
    #c { display:block; width:100vw; height:100vh; }

    /* ══ INTRO ══ */
    #intro {
      position:fixed; inset:0; z-index:900;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
      background:radial-gradient(ellipse at center,#0d1f2d 0%,#0a0a0f 100%);
    }
    #intro-logo { width:200px; height:auto; border-radius:12px;
                  filter:drop-shadow(0 0 18px rgba(0,212,255,.35)); }
    #intro-sub { color:rgba(255,255,255,.4); font-size:.82rem; letter-spacing:3px; }
    #intro-btn {
      margin-top:10px; padding:14px 44px; border:none; border-radius:50px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff; font-size:1rem; font-weight:700; letter-spacing:2px; cursor:pointer;
      box-shadow:0 0 32px rgba(0,212,255,.5); transition:transform .2s,box-shadow .2s;
    }
    #intro-btn:hover { transform:scale(1.06); box-shadow:0 0 50px rgba(0,212,255,.7); }
    .intro-dots { display:flex; gap:10px; }
    .intro-dot { width:8px; height:8px; border-radius:50%; background:rgba(0,212,255,.3);
                 animation:dot-pulse 1.4s ease-in-out infinite; }
    .intro-dot:nth-child(2){animation-delay:.2s}
    .intro-dot:nth-child(3){animation-delay:.4s}
    @keyframes dot-pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

    /* ══ HUD ══ */
    #hud {
      position:fixed; top:0; left:0; right:0; z-index:200; display:none;
      align-items:center; justify-content:space-between; padding:16px 28px;
      background:linear-gradient(180deg,rgba(0,0,0,.8) 0%,transparent 100%);
      pointer-events:none;
    }
    #hud-logo { height:36px; width:auto; border-radius:8px;
                filter:drop-shadow(0 0 8px rgba(0,212,255,.3)); }
    #scene-badge {
      font-size:.82rem; color:#fff; letter-spacing:1px;
      background:rgba(0,212,255,.18); border:1px solid rgba(0,212,255,.4);
      padding:5px 18px; border-radius:20px;
    }

    /* ══ FLÈCHES DIRECTIONNELLES CLIGNOTANTES ══ */
    .dir-arrow {
      position:fixed; top:50%; transform:translateY(-50%);
      z-index:200; pointer-events:none;
      display:none; flex-direction:column; align-items:center; gap:4px;
    }
    #arrow-left  { left:20px; }
    #arrow-right { right:20px; }
    .arr-chevron {
      font-size:2.8rem; color:rgba(0,212,255,.9);
      filter:drop-shadow(0 0 12px rgba(0,212,255,.8));
      animation:blink-arr 1.1s ease-in-out infinite;
    }
    #arrow-left  .arr-chevron { animation-delay:0s; }
    #arrow-right .arr-chevron { animation-delay:.55s; }
    .arr-trail {
      font-size:1.6rem; color:rgba(0,212,255,.4);
      filter:drop-shadow(0 0 6px rgba(0,212,255,.4));
      animation:blink-arr 1.1s ease-in-out infinite;
    }
    #arrow-left  .arr-trail { animation-delay:.15s; }
    #arrow-right .arr-trail { animation-delay:.7s; }
    .arr-lbl { font-size:.58rem; color:rgba(0,212,255,.6); letter-spacing:2px; margin-top:4px; }
    @keyframes blink-arr {
      0%,100%{opacity:.2;transform:scale(.95)}
      50%{opacity:1;transform:scale(1.05)}
    }

    /* ══ BARRE SCÈNES ══ */
    #scene-bar {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      z-index:200; display:none; align-items:center; gap:14px;
      background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.1);
      padding:10px 24px; border-radius:40px; backdrop-filter:blur(12px);
    }
    .scene-dot { display:flex; flex-direction:column; align-items:center; gap:5px;
                 cursor:pointer; transition:transform .2s; pointer-events:all; }
    .scene-dot:hover { transform:scale(1.12); }
    .dot-ring { width:14px; height:14px; border-radius:50%;
                border:2px solid rgba(0,212,255,.5); background:rgba(0,212,255,.1);
                transition:background .2s,border-color .2s,box-shadow .2s; }
    .scene-dot.active .dot-ring {
      background:var(--accent); border-color:var(--accent);
      box-shadow:0 0 14px rgba(0,212,255,.8);
    }
    .dot-label { font-size:.6rem; color:rgba(255,255,255,.5); letter-spacing:1px; white-space:nowrap; }
    .scene-dot.active .dot-label { color:#fff; }

    /* ══ CONTRÔLES ══ */
    #controls {
      position:fixed; top:18px; right:24px; z-index:200;
      display:none; align-items:center; gap:10px;
    }
    .ctrl-btn {
      background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.12);
      color:#fff; border-radius:10px; padding:7px 14px; cursor:pointer;
      font-size:.8rem; letter-spacing:1px; backdrop-filter:blur(8px);
      transition:border-color .2s,color .2s; pointer-events:all;
    }
    .ctrl-btn:hover { border-color:var(--accent); color:var(--accent); }
    #auto-btn.playing { border-color:var(--accent); color:var(--accent);
                        box-shadow:0 0 12px rgba(0,212,255,.4); }

    /* ══ HOTSPOTS ══ */
    .hotspot {
      position:fixed; transform:translate(-50%,-50%); z-index:200;
      display:flex; flex-direction:column; align-items:center; gap:7px;
      cursor:pointer; pointer-events:all; transition:opacity .3s;
    }
    .hotspot.hidden { opacity:0; pointer-events:none; }
    .hotspot:hover .hs-ring { transform:scale(1.1); }
    .hs-ring {
      width:58px; height:58px; border-radius:50%;
      border:2px solid rgba(0,212,255,.8); background:rgba(0,0,0,.4);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 22px rgba(0,212,255,.5),inset 0 0 14px rgba(0,212,255,.1);
      backdrop-filter:blur(6px); transition:transform .2s;
      animation:hs-float 2.8s ease-in-out infinite;
    }
    .hs-icon { font-size:1.5rem; filter:drop-shadow(0 0 5px #00d4ff); }
    .hs-label {
      font-size:.6rem; color:#fff; letter-spacing:1.5px; text-transform:uppercase;
      background:rgba(0,0,0,.6); padding:3px 9px; border-radius:8px;
      border:1px solid rgba(0,212,255,.3); backdrop-filter:blur(4px); white-space:nowrap;
    }
    .hotspot::before {
      content:''; position:absolute; width:58px; height:58px; border-radius:50%;
      border:2px solid rgba(0,212,255,.22); animation:hs-pulse 2.8s ease-out infinite;
    }
    @keyframes hs-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes hs-pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.9);opacity:0}}

    /* ══ POI (Points d'intérêt) ══ */
    .poi {
      position:fixed; transform:translate(-50%,-50%); z-index:210;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      cursor:pointer; pointer-events:all; transition:opacity .3s;
    }
    .poi.hidden { opacity:0; pointer-events:none; }
    .poi-ring {
      width:46px; height:46px; border-radius:50%;
      border:2px solid rgba(255,200,0,.85); background:rgba(0,0,0,.5);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 18px rgba(255,200,0,.5);
      backdrop-filter:blur(6px); transition:transform .2s;
      animation:poi-pulse 2s ease-in-out infinite;
    }
    .poi:hover .poi-ring { transform:scale(1.12); }
    .poi-icon { font-size:1.3rem; }
    .poi-lbl {
      font-size:.58rem; color:#ffe066; letter-spacing:1.5px; text-transform:uppercase;
      background:rgba(0,0,0,.65); padding:2px 8px; border-radius:7px;
      border:1px solid rgba(255,200,0,.3); white-space:nowrap;
    }
    @keyframes poi-pulse{0%,100%{box-shadow:0 0 18px rgba(255,200,0,.5)}50%{box-shadow:0 0 30px rgba(255,200,0,.9)}}

    /* ══ POI CLIGNOTANT (produits) ══ */
    .poi-blink .poi-ring {
      border-color:rgba(0,212,255,.9);
      box-shadow:0 0 20px rgba(0,212,255,.7);
      animation:poi-blink-glow 1s ease-in-out infinite;
    }
    .poi-blink .poi-lbl { color:var(--accent); border-color:rgba(0,212,255,.4); }
    @keyframes poi-blink-glow {
      0%,100%{opacity:1; box-shadow:0 0 14px rgba(0,212,255,.5);}
      50%{opacity:.25; box-shadow:0 0 28px rgba(0,212,255,.9);}
    }

    /* ══ MODAL POI ══ */
    #poi-modal {
      position:fixed; inset:0; z-index:800; display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.75); backdrop-filter:blur(6px);
    }
    #poi-modal.open { display:flex; animation:modal-in .25s ease; }
    @keyframes modal-in{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
    #poi-card {
      background:#111827; border:1px solid rgba(0,212,255,.25); border-radius:20px;
      max-width:520px; width:90vw; overflow:hidden;
      box-shadow:0 0 60px rgba(0,212,255,.2);
    }
    #poi-img-wrap { width:100%; max-height:260px; overflow:hidden; background:#0d1117; }
    #poi-img-wrap img { width:100%; height:260px; object-fit:cover; display:block; }
    #poi-img-wrap .no-img {
      height:120px; display:flex; align-items:center; justify-content:center;
      font-size:3rem; color:rgba(255,255,255,.15);
    }
    #poi-body { padding:22px 24px 24px; }
    #poi-title { font-size:1.1rem; font-weight:700; color:#fff; margin-bottom:8px; }
    #poi-desc { font-size:.88rem; color:rgba(255,255,255,.6); line-height:1.65; }
    #poi-close {
      position:absolute; top:14px; right:18px; font-size:1.4rem; cursor:pointer;
      color:rgba(255,255,255,.5); transition:color .2s;
    }
    #poi-close:hover { color:#fff; }
    #poi-card { position:relative; }

    /* ══ AUTO-INDICATOR ══ */
    #auto-indicator {
      position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      z-index:200; display:none; align-items:center; gap:8px;
      color:rgba(255,255,255,.35); font-size:.68rem; letter-spacing:1.5px;
      pointer-events:none;
    }
    .sweep-bar { width:120px; height:3px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
    #sweep-fill { height:100%; width:0%; border-radius:2px;
                  background:linear-gradient(90deg,var(--accent),var(--accent2)); }

    /* ══ FLASH ══ */
    #flash { position:fixed; inset:0; z-index:700; pointer-events:none; opacity:0; }
    #flash.go { animation:flash-anim .6s ease-out forwards; }
    @keyframes flash-anim{
      0%{opacity:0;background:radial-gradient(circle,var(--accent),#fff 35%,transparent 70%)}
      40%{opacity:1;background:radial-gradient(circle,var(--accent),#fff 35%,transparent 70%)}
      60%{opacity:1;background:#fff}
      100%{opacity:0;background:#fff}
    }

    /* ══ JOYSTICK DIRECTIONNEL ══ */
    #nav-pad {
      position:fixed; bottom:80px; right:24px; z-index:300;
      display:none; flex-direction:column; align-items:center; gap:3px;
    }
    .pad-row { display:flex; gap:3px; }
    .pad-btn {
      width:46px; height:46px; border-radius:12px;
      background:rgba(0,0,0,.6); border:1px solid rgba(0,212,255,.35);
      color:#fff; font-size:1.2rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px);
      transition:background .15s, border-color .15s, transform .1s;
      user-select:none; -webkit-user-select:none;
    }
    .pad-btn:hover  { background:rgba(0,212,255,.18); border-color:var(--accent); }
    .pad-btn:active, .pad-btn.pressed {
      background:rgba(0,212,255,.35); border-color:var(--accent);
      transform:scale(.92); box-shadow:0 0 12px rgba(0,212,255,.5);
    }
    .pad-center {
      width:46px; height:46px; border-radius:50%;
      background:rgba(0,212,255,.08); border:1px solid rgba(0,212,255,.2);
    }
    /* Zoom +/- */
    #zoom-pad {
      position:fixed; bottom:80px; right:80px; z-index:300;
      display:none; flex-direction:column; gap:4px;
    }
    .zoom-btn {
      width:42px; height:42px; border-radius:50%;
      background:rgba(0,0,0,.6); border:1px solid rgba(0,212,255,.35);
      color:var(--accent); font-size:1.4rem; font-weight:700; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px); user-select:none; -webkit-user-select:none;
      transition:background .15s, transform .1s;
    }
    .zoom-btn:hover  { background:rgba(0,212,255,.18); }
    .zoom-btn:active, .zoom-btn.pressed {
      background:rgba(0,212,255,.35); transform:scale(.92);
    }

    /* ══ SIDEBAR PRODUITS ══ */
    #product-sidebar {
      position:fixed; left:0; top:50%; transform:translateY(-50%);
      z-index:250; display:none; flex-direction:column; gap:0;
      padding:10px 8px; height:72vh; overflow:hidden;
      background:rgba(0,0,0,.62); border-right:1px solid rgba(0,212,255,.2);
      border-radius:0 16px 16px 0; backdrop-filter:blur(12px);
    }
    .scroll-window { overflow:hidden; flex:1; padding-top:4px; }
    .scroll-track {
      display:flex; flex-direction:column; gap:8px;
      animation:scroll-up 28s linear infinite;
      will-change:transform;
    }
    .scroll-track:hover { animation-play-state:paused; }
    @keyframes scroll-up {
      0%   { transform:translateY(0); }
      100% { transform:translateY(-50%); }
    }
    #sidebar-label {
      font-size:.5rem; color:rgba(0,212,255,.6); letter-spacing:2px;
      text-align:center; text-transform:uppercase; padding-bottom:4px;
      border-bottom:1px solid rgba(0,212,255,.15); margin-bottom:2px;
    }
    .prod-thumb {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      cursor:pointer; padding:6px; border-radius:10px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.04); width:74px;
      transition:background .2s, border-color .2s, transform .18s;
    }
    .prod-thumb:hover {
      background:rgba(0,212,255,.15); border-color:rgba(0,212,255,.55);
      transform:scale(1.07);
    }
    .prod-thumb img {
      width:62px; height:54px; object-fit:contain; border-radius:7px;
      background:#111; display:block;
    }
    .prod-thumb-name {
      font-size:.46rem; color:rgba(255,255,255,.55); text-align:center;
      line-height:1.25; max-width:68px; overflow:hidden;
      display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
    }

    /* ══ OVERLAY PRODUIT CENTRÉ — fond transparent, vitre ══ */
    #product-overlay {
      position:fixed; inset:0; z-index:870; display:none;
      align-items:center; justify-content:center;
      background:transparent;   /* la scène 360 reste visible */
    }
    #product-overlay.open { display:flex; animation:modal-in .25s ease; }

    #product-card {
      position:relative;
      /* effet vitre / glassmorphism */
      background:rgba(255,255,255,.10);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      border:1px solid rgba(255,255,255,.28);
      border-radius:24px;
      width:70vw; max-width:900px;
      overflow:hidden;
      box-shadow:0 8px 48px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08);
    }
    #product-card-img {
      width:100%; height:55vh; object-fit:contain;
      background:rgba(0,0,0,.15); display:block; padding:24px;
    }
    #product-card-body {
      padding:14px 26px 20px;
      border-top:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.18);
    }
    #product-card-name {
      font-size:1.1rem; font-weight:700; color:#fff;
      letter-spacing:.5px; text-shadow:0 1px 6px rgba(0,0,0,.6);
    }
    #product-card-close {
      position:absolute; top:14px; right:18px; font-size:1.4rem;
      cursor:pointer; color:rgba(255,255,255,.6); transition:color .2s;
      line-height:1; z-index:10;
      text-shadow:0 1px 4px rgba(0,0,0,.5);
    }
    #product-card-close:hover { color:#fff; }

    /* ══ VIDÉO PiP (bas-gauche) ══ */
    #video-pip {
      position:fixed; bottom:86px; left:96px; z-index:260;
      display:none; flex-direction:column;
      width:148px; border-radius:14px; overflow:hidden;
      border:1px solid rgba(0,212,255,.45);
      box-shadow:0 4px 24px rgba(0,0,0,.55);
      cursor:pointer; transition:transform .2s, box-shadow .2s;
    }
    #video-pip:hover { transform:scale(1.04); box-shadow:0 6px 32px rgba(0,212,255,.35); }
    #pip-thumb { position:relative; width:100%; height:90px; }
    #pip-vid { width:100%; height:100%; object-fit:cover; display:block; }
    #pip-overlay {
      position:absolute; inset:0; background:rgba(0,0,0,.3);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      transition:background .2s;
    }
    #video-pip:hover #pip-overlay { background:rgba(0,212,255,.18); }
    #pip-play-icon { font-size:1.9rem; color:#fff; filter:drop-shadow(0 0 8px rgba(0,212,255,.9)); }
    #pip-footer {
      background:rgba(0,0,0,.75); padding:5px 8px;
      font-size:.5rem; color:rgba(255,255,255,.75); letter-spacing:.8px;
      text-align:center; border-top:1px solid rgba(0,212,255,.2);
    }

    /* ══ VIDÉO PLEIN ÉCRAN ══ */
    #video-fs-overlay {
      position:fixed; inset:0; z-index:890;
      display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.88);
    }
    #video-fs-overlay.open { display:flex; animation:modal-in .25s ease; }
    #fs-vid {
      max-width:92vw; max-height:86vh;
      border-radius:14px; outline:none;
      box-shadow:0 0 60px rgba(0,0,0,.7);
    }
    #fs-close {
      position:absolute; top:20px; right:24px;
      background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.2);
      color:#fff; padding:8px 18px; border-radius:20px;
      cursor:pointer; font-size:.82rem; letter-spacing:1px;
      backdrop-filter:blur(6px); transition:background .2s;
    }
    #fs-close:hover { background:rgba(0,212,255,.3); border-color:var(--accent); }

    /* ══ HINT ══ */
    #hint {
      position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      z-index:200; color:rgba(255,255,255,.3); font-size:.68rem; letter-spacing:1px;
      pointer-events:none; white-space:nowrap; animation:fade-hint 8s forwards; display:none;
    }
    @keyframes fade-hint{0%,60%{opacity:1}100%{opacity:0}}
  </style>
</head>
<body>

<!-- ══ Intro ══ -->
<div id="intro">
  <div class="intro-dots">
    <div class="intro-dot"></div><div class="intro-dot"></div><div class="intro-dot"></div>
  </div>
  <img src="images/logointelligentsia.JPG" alt="Intelligentsia" id="intro-logo">
  <div id="intro-sub">VISITE VIRTUELLE — 4 SCÈNES</div>
  <button id="intro-btn" onclick="startTour()">▶ DÉMARRER LA VISITE</button>
</div>

<!-- ══ Canvas ══ -->
<canvas id="c"></canvas>

<!-- ══ HUD ══ -->
<div id="hud">
  <img src="images/logointelligentsia.JPG" alt="Intelligentsia" id="hud-logo">
  <div id="scene-badge">—</div>
</div>

<!-- ══ Flèches directionnelles ══ -->
<div class="dir-arrow" id="arrow-left">
  <div class="arr-trail">‹</div>
  <div class="arr-chevron">‹‹</div>
  <div class="arr-trail">‹</div>
  <div class="arr-lbl">SENS</div>
</div>
<div class="dir-arrow" id="arrow-right">
  <div class="arr-trail">›</div>
  <div class="arr-chevron">››</div>
  <div class="arr-trail">›</div>
  <div class="arr-lbl">SENS</div>
</div>

<!-- ══ Contrôles ══ -->
<div id="controls">
  <div class="ctrl-btn playing" id="auto-btn" onclick="toggleAuto()">⟳ Auto</div>
  <div class="ctrl-btn" onclick="prevScene()">← Préc.</div>
  <div class="ctrl-btn" onclick="nextScene()">Suiv. →</div>
  <div class="ctrl-btn" onclick="toggleFullscreen()">⛶</div>
</div>

<!-- ══ Barre scènes ══ -->
<div id="scene-bar"></div>

<!-- ══ Auto indicator ══ -->
<div id="auto-indicator">
  <span>ROTATION AUTO</span>
  <div class="sweep-bar"><div id="sweep-fill"></div></div>
</div>

<!-- ══ Modal POI ══ -->
<div id="poi-modal" onclick="closePoi(event)">
  <div id="poi-card">
    <span id="poi-close" onclick="closePoi()">✕</span>
    <div id="poi-img-wrap"></div>
    <div id="poi-body">
      <div id="poi-title"></div>
      <div id="poi-desc"></div>
    </div>
  </div>

    <div class="pad-center"></div>

  </div>
  <div class="pad-row">
    <div style="width:46px"></div>
    <div class="pad-btn" id="pad-down"  data-dir="down">▼</div>

<div id="zoom-pad">
  <div class="zoom-btn" id="zoom-in"  data-zoom="in">＋</div>
  <div class="zoom-btn" id="zoom-out" data-zoom="out">－</div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   INTELLIGENSIA 360
   Ordre : Dehors (sens opposé) → Avant → Droite → Derrière
   + Flèches clignotantes + POI cliquables
════════════════════════════════════════════════════════ */

// ─────────────────────────────────────────────────────────
//  DONNÉES DES SCÈNES
//  startLon : angle de départ de la caméra (180 = sens opposé)
//  hotspots : portails de téléportation
//  pois     : points d'intérêt cliquables (⭐)
//             { lon, lat, icon, label, title, desc, img }
//             img = chemin relatif d'une image, ou null
// ─────────────────────────────────────────────────────────
const SCENES = [
  {
    id:0, name:"Vue Dehors", img:"images/vuedehors.JPG",
    startLon: 180,   // ← sens opposé
    hotspots:[
      { lon: 10, lat:0,  label:"Vue Avant",  icon:"🔵", target:1 },
      { lon: 90, lat:5,  label:"Vue Droite", icon:"🟢", target:2 },
      { lon:-10, lat:0,  label:"Derrière",   icon:"🔴", target:3 },
    ],
    pois:[
      // EXEMPLE — remplacez title/desc/img selon vos besoins
      { lon:180, lat:10, icon:"⭐", label:"Extérieur",
        title:"Vue extérieure",
        desc:"Description de la vue extérieure. Ajoutez ici les informations que vous souhaitez afficher à vos visiteurs.",
        img:null }
    ]
  },
  {
    id:1, name:"Vue Avant", img:"images/devanttrue.jpeg",
    startLon: 0,
    hotspots:[
      { lon:165, lat:0,  label:"Derrière",   icon:"🔴", target:3 },
      { lon: 90, lat:5,  label:"Vue Droite", icon:"🟢", target:2 },
      { lon:-60, lat:-5, label:"Vue Dehors", icon:"🟡", target:0 },
    ],
    pois:[
      { lon:-28, lat:-8, icon:"🖨️", label:"Imprimante HP",
        title:"HP LaserJet Pro 4003dn",
        desc:"Imprimante laser monochrome professionnelle. Garantie 6 mois — produit authentique certifié EDIMO DIGITAL. Idéale pour un usage bureautique intensif.",
        img:"images/imprimante_laser_monochrome_hp_1.jpg",
        blink:true },
      { lon:22, lat:-12, icon:"💻", label:"Postes informatiques",
        title:"Bureau informatique HP",
        desc:"Table en verre équipée de postes informatiques HP. Espace de travail professionnel configuré pour votre productivité.",
        img:"images/ordinateurhp.JPG",
        blink:true },
    ]
  },
  {
    id:2, name:"Vue Droite", img:"images/a2droite.jpeg",
    startLon: 0,
    hotspots:[
      { lon:  0, lat:0,  label:"Vue Avant",  icon:"🔵", target:1 },
      { lon:180, lat:0,  label:"Derrière",   icon:"🔴", target:3 },
      { lon:-90, lat:-5, label:"Vue Dehors", icon:"🟡", target:0 },
    ],
    pois:[
      { lon:90, lat:10, icon:"⭐", label:"Côté droit",
        title:"Vue Droite",
        desc:"Description du côté droit. Personnalisez ce texte et ajoutez une image de détail.",
        img:null }
    ]
  },
  {
    id:3, name:"Derrière", img:"images/plan-arrierebb.jpeg",
    startLon: 0,
    hotspots:[
      { lon:  0, lat:0,  label:"Vue Avant",  icon:"🔵", target:1 },
      { lon: 90, lat:5,  label:"Vue Droite", icon:"🟢", target:2 },
      { lon:-90, lat:-5, label:"Vue Dehors", icon:"🟡", target:0 },
    ],
    pois:[
      { lon:180, lat:10, icon:"⭐", label:"Arrière",
        title:"Vue Derrière",
        desc:"Description de la vue arrière. Ajoutez vos informations ici.",
        img:null }
    ]
  },
];

// ─────────────────────────────────────────────────────────
//  THREE.JS
// ─────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 1, 1100);
const geo    = new THREE.SphereGeometry(500, 64, 40);
geo.scale(-1, 1, 1);
let mesh = null;

// ─────────────────────────────────────────────────────────
//  ÉTAT
// ─────────────────────────────────────────────────────────
let lon=0, lat=0, vlon=0, vlat=0;
let isDragging=false, px=0, py=0;
let ready=false, currentSceneIdx=0;
let autoPlay=true, autoLon=0;
const AUTO_SPEED=0.18, AUTO_TOTAL=360;
let hotspotEls=[], poiEls=[];

// ─────────────────────────────────────────────────────────
//  CHARGEMENT SCÈNE
// ─────────────────────────────────────────────────────────
const loader = new THREE.TextureLoader();

function loadScene(idx, onDone) {
  const s = SCENES[idx];
  loader.load(s.img, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = tex.magFilter = THREE.LinearFilter;
    if (mesh) { scene.remove(mesh); mesh.material.map.dispose(); mesh.material.dispose(); }
    mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map:tex }));
    scene.add(mesh);
    if (onDone) onDone();
  });
}

// ─────────────────────────────────────────────────────────
//  DÉMARRAGE
// ─────────────────────────────────────────────────────────
function startTour() {
  document.getElementById('intro').style.display = 'none';
  loadScene(0, () => {
    currentSceneIdx = 0;
    lon = SCENES[0].startLon;
    autoLon = 0; lat=0; vlon=vlat=0;
    ready = true;
    showUI(); buildSceneBar(); buildHotspots(); buildPois(); buildProductSidebar(); updateUI();
    animate();
  });
}

function showUI() {
  ['hud','controls','scene-bar','auto-indicator'].forEach(id =>
    document.getElementById(id).style.display = 'flex');
  document.getElementById('hint').style.display = 'block';
  document.getElementById('video-pip').style.display = 'flex';
  setArrows(true);
  showNavPad();
}

// ─────────────────────────────────────────────────────────
//  FLÈCHES DIRECTIONNELLES
// ─────────────────────────────────────────────────────────
function setArrows(show) {
  const dir = AUTO_SPEED > 0 ? 'right' : 'left';
  document.getElementById('arrow-right').style.display = (show && dir==='right') ? 'flex' : 'none';
  document.getElementById('arrow-left').style.display  = (show && dir==='left')  ? 'flex' : 'none';
}

// ─────────────────────────────────────────────────────────
//  BARRE SCÈNES
// ─────────────────────────────────────────────────────────
function buildSceneBar() {
  const bar = document.getElementById('scene-bar');
  bar.innerHTML = '';
  SCENES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'scene-dot' + (i===0?' active':'');
    el.id = `sdot-${i}`;
    el.innerHTML = `<div class="dot-ring"></div><div class="dot-label">${s.name}</div>`;
    el.onclick = () => teleport(i);
    bar.appendChild(el);
  });
}

// ─────────────────────────────────────────────────────────
//  HOTSPOTS
// ─────────────────────────────────────────────────────────
function buildHotspots() {
  hotspotEls.forEach(el => el.remove()); hotspotEls = [];
  SCENES[currentSceneIdx].hotspots.forEach((hs, i) => {
    const el = document.createElement('div');
    el.className = 'hotspot hidden';
    el.innerHTML = `<div class="hs-ring"><span class="hs-icon">${hs.icon}</span></div>
                    <div class="hs-label">${hs.label}</div>`;
    el.addEventListener('click', () => teleport(hs.target));
    document.body.appendChild(el);
    hotspotEls.push(el);
  });
}

// ─────────────────────────────────────────────────────────
//  POI — Points d'intérêt
// ─────────────────────────────────────────────────────────
function buildPois() {
  poiEls.forEach(el => el.remove()); poiEls = [];
  SCENES[currentSceneIdx].pois.forEach((poi, i) => {
    const el = document.createElement('div');
    el.className = 'poi hidden' + (poi.blink ? ' poi-blink' : '');
    el.innerHTML = `<div class="poi-ring"><span class="poi-icon">${poi.icon}</span></div>
                    <div class="poi-lbl">${poi.label}</div>`;
    el.addEventListener('click', () => openPoi(poi));
    document.body.appendChild(el);
    poiEls.push(el);
  });
}

function updateOverlays() {
  const hs = SCENES[currentSceneIdx].hotspots;
  const ps = SCENES[currentSceneIdx].pois;

  const project = (lo, la, size, el) => {
    const pos  = lonLatToVec3(lo, la, 490);
    const proj = pos.clone().project(camera);
    if (proj.z > 0.995) { el.classList.add('hidden'); return; }
    const sx = ( proj.x+1)/2*innerWidth;
    const sy = (-proj.y+1)/2*innerHeight;
    if (sx < -80 || sx > innerWidth+80 || sy < -80 || sy > innerHeight+80) {
      el.classList.add('hidden'); return;
    }
    el.classList.remove('hidden');
    el.style.left = sx+'px'; el.style.top = sy+'px';
  };

  hotspotEls.forEach((el,i) => { if(i<hs.length) project(hs[i].lon,hs[i].lat,58,el); });
  poiEls.forEach((el,i)     => { if(i<ps.length) project(ps[i].lon,ps[i].lat,46,el); });
}

// ─────────────────────────────────────────────────────────
//  MODAL POI
// ─────────────────────────────────────────────────────────
function openPoi(poi) {
  if (autoPlay) toggleAuto();
  const wrap = document.getElementById('poi-img-wrap');
  wrap.innerHTML = poi.img
    ? `<img src="${poi.img}" alt="${poi.title}">`
    : `<div class="no-img">${poi.icon}</div>`;
  document.getElementById('poi-title').textContent = poi.title;
  document.getElementById('poi-desc').textContent  = poi.desc;
  document.getElementById('poi-modal').classList.add('open');
}

function closePoi(e) {
  if (e && e.target !== document.getElementById('poi-modal') &&
      e.target !== document.getElementById('poi-close')) return;
  document.getElementById('poi-modal').classList.remove('open');
}

// ─────────────────────────────────────────────────────────
//  TÉLÉPORTATION
// ─────────────────────────────────────────────────────────
function teleport(targetIdx) {
  if (!ready || targetIdx === currentSceneIdx) return;
  ready = false;
  const fl = document.getElementById('flash');
  fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  setTimeout(() => {
    currentSceneIdx = targetIdx;
    loadScene(currentSceneIdx, () => {
      lon    = SCENES[currentSceneIdx].startLon;
      autoLon = 0; lat=0; vlon=vlat=0;
      ready  = true;
      buildHotspots(); buildPois(); updateUI();
    });
  }, 300);
  setTimeout(() => fl.classList.remove('go'), 700);
}

function nextScene() { teleport((currentSceneIdx+1) % SCENES.length); }
function prevScene() { teleport((currentSceneIdx-1+SCENES.length) % SCENES.length); }

// ─────────────────────────────────────────────────────────
//  AUTO-ROTATION
// ─────────────────────────────────────────────────────────
function toggleAuto() {
  autoPlay = !autoPlay;
  if (autoPlay) autoLon = 0;
  document.getElementById('auto-btn').classList.toggle('playing', autoPlay);
  document.getElementById('auto-indicator').style.display = autoPlay ? 'flex' : 'none';
  setArrows(autoPlay);
}

function updateUI() {
  document.getElementById('scene-badge').textContent = SCENES[currentSceneIdx].name;
  document.querySelectorAll('.scene-dot').forEach((el,i) =>
    el.classList.toggle('active', i===currentSceneIdx));
  document.getElementById('auto-btn').classList.toggle('playing', autoPlay);
}

// ─────────────────────────────────────────────────────────
//  CONTRÔLES
// ─────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  isDragging=true; px=e.clientX; py=e.clientY; vlon=vlat=0;
  document.body.classList.add('dragging');
  if (autoPlay) toggleAuto();
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx=e.clientX-px, dy=e.clientY-py;
  vlon=dx*.25; vlat=dy*.15;
  lon-=dx*.25; lat=clamp(lat+dy*.15,-85,85);
  px=e.clientX; py=e.clientY;
});
document.addEventListener('mouseup', () => {
  isDragging=false; document.body.classList.remove('dragging');
});
canvas.addEventListener('touchstart', e => {
  px=e.touches[0].clientX; py=e.touches[0].clientY; vlon=vlat=0;
  if (autoPlay) toggleAuto();
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  const dx=e.touches[0].clientX-px, dy=e.touches[0].clientY-py;
  lon-=dx*.25; lat=clamp(lat+dy*.15,-85,85);
  px=e.touches[0].clientX; py=e.touches[0].clientY;
}, {passive:false});
canvas.addEventListener('wheel', e => {
  const f = clamp(camera.fov+e.deltaY*.04,30,110);
  camera.fov=f; camera.updateProjectionMatrix();
}, {passive:true});
canvas.addEventListener('dblclick', toggleFullscreen);
window.addEventListener('resize', () => {
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ─────────────────────────────────────────────────────────
//  UTILITAIRES
// ─────────────────────────────────────────────────────────
function clamp(v,mn,mx) { return Math.max(mn,Math.min(mx,v)); }
function lonLatToVec3(lo,la,r=500) {
  const phi=(90-la)*Math.PI/180, th=lo*Math.PI/180;
  return new THREE.Vector3(r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th));
}
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

// ─────────────────────────────────────────────────────────
//  CATALOGUE PRODUITS — sidebar gauche
// ─────────────────────────────────────────────────────────
const PRODUCTS = [
  { name:"Imprimante Laser HP LaserJet Pro 4003dn",   img:"images/imprimante_laser_monochrome_hp_1.jpg" },
  { name:"Imprimante Laser HP",                        img:"images/laserhp.JPG" },
  { name:"Imprimante Laser MFP",                       img:"images/imprimante laser MFp.jpeg" },
  { name:"Imprimante de carte bancaire",               img:"images/imprimante de carte bancaire.png" },
  { name:"Écran HP 527SW 27\"",                        img:"images/ecran_dekstop.jpeg" },
  { name:"Laptop Lenovo",                              img:"images/latop lenovo.jpeg" },
  { name:"Scanner Canon",                              img:"images/scanner cannon.jpeg" },
  { name:"Switch Desktop 24 ports",                    img:"images/dekstop switch 24 port.jpeg" },
  { name:"Onduleur",                                   img:"images/onduleur.JPG" },
  { name:"DAB — Distributeur automatique",             img:"images/dab.jpg" },
  { name:"Clavier HP",                                 img:"images/clavier.JPG" },
  { name:"Écouteur Logitech",                          img:"images/ecouteur logitech.jpeg" },
  { name:"Sac ordinateur Lenovo",                      img:"images/sac ordinateur lenovo.jpeg" },
  { name:"Patch Cord",                                 img:"images/patch cord.jpeg" },
  { name:"Pince à sertir",                             img:"images/pince a certire.jpeg" },
  { name:"Souffleur Upspirit",                         img:"images/souffleur upspirit.jpeg" },
];

function buildProductSidebar() {
  const track = document.getElementById('scroll-track');
  track.innerHTML = '';
  // Duplicate list for seamless infinite scroll
  [...PRODUCTS, ...PRODUCTS].forEach(p => {
    const el = document.createElement('div');
    el.className = 'prod-thumb';
    el.innerHTML = `<img src="${p.img}" alt="${p.name}" loading="lazy">
                    <div class="prod-thumb-name">${p.name}</div>`;
    el.addEventListener('mousedown', e => e.stopPropagation());
    el.addEventListener('click',     e => { e.stopPropagation(); openProduct(p); });
    track.appendChild(el);
  });
  document.getElementById('product-sidebar').style.display = 'flex';
}

function expandVideo() {
  const fsVid = document.getElementById('fs-vid');
  fsVid.currentTime = 0;
  fsVid.play();
  document.getElementById('video-fs-overlay').classList.add('open');
}

function minimizeVideo() {
  document.getElementById('fs-vid').pause();
  document.getElementById('video-fs-overlay').classList.remove('open');
}

function openProduct(p) {
  document.getElementById('product-card-img').src  = p.img;
  document.getElementById('product-card-img').alt  = p.name;
  document.getElementById('product-card-name').textContent = p.name;
  document.getElementById('product-overlay').classList.add('open');
}

function closeProduct(e) {
  if (e && e.target !== document.getElementById('product-overlay') &&
      e.target !== document.getElementById('product-card-close')) return;
  document.getElementById('product-overlay').classList.remove('open');
}

// ─────────────────────────────────────────────────────────
//  JOYSTICK DIRECTIONNEL
// ─────────────────────────────────────────────────────────
const padState  = { up:false, down:false, left:false, right:false };
const zoomState = { in:false, out:false };
const PAD_SPEED  = 1.2;   // degrés/frame
const ZOOM_SPEED = 0.8;   // FOV/frame

function showNavPad() {
  document.getElementById('nav-pad').style.display  = 'flex';
  document.getElementById('zoom-pad').style.display = 'flex';
}

function bindPad(id, key, stateObj) {
  const el = document.getElementById(id);
  const press   = () => { stateObj[key]=true;  el.classList.add('pressed');
                           if(autoPlay) toggleAuto(); };
  const release = () => { stateObj[key]=false; el.classList.remove('pressed'); };
  el.addEventListener('mousedown',  press);
  el.addEventListener('touchstart', e => { e.preventDefault(); press(); }, {passive:false});
  el.addEventListener('mouseup',    release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchend',   release);
  el.addEventListener('touchcancel',release);
}

bindPad('pad-up',    'up',    padState);
bindPad('pad-down',  'down',  padState);
bindPad('pad-left',  'left',  padState);
bindPad('pad-right', 'right', padState);
bindPad('zoom-in',   'in',    zoomState);
bindPad('zoom-out',  'out',   zoomState);

function applyPad() {
  if (padState.left)  { lon  -= PAD_SPEED; vlon = 0; }
  if (padState.right) { lon  += PAD_SPEED; vlon = 0; }
  if (padState.up)    { lat   = clamp(lat + PAD_SPEED, -85, 85); vlat = 0; }
  if (padState.down)  { lat   = clamp(lat - PAD_SPEED, -85, 85); vlat = 0; }

  if (zoomState.in || zoomState.out) {
    const delta = zoomState.in ? -ZOOM_SPEED : ZOOM_SPEED;
    camera.fov  = clamp(camera.fov + delta, 30, 110);
    camera.updateProjectionMatrix();
  }
}

// ─────────────────────────────────────────────────────────
//  BOUCLE RENDU
// ─────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (!ready) return;

  if (autoPlay) {
    lon += AUTO_SPEED; autoLon += AUTO_SPEED;
    document.getElementById('sweep-fill').style.width =
      Math.min(autoLon/AUTO_TOTAL*100,100)+'%';
    if (autoLon >= AUTO_TOTAL) {
      autoLon=0;
      document.getElementById('sweep-fill').style.width='0%';
      nextScene(); return;
    }
  } else {
    if (!isDragging) {
      lon-=vlon; vlon*=.88;
      lat=clamp(lat+vlat,-85,85); vlat*=.88;
    }
  }
  applyPad();
  camera.lookAt(lonLatToVec3(lon,lat));
  renderer.render(scene,camera);
  updateOverlays();
}
</script>
